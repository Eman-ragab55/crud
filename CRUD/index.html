<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>CRUD</title>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <h1 class="text-center text-primary mt-4 mb-4">Product Management System</h1>

  <div class="container">
    <div class="row">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="product-name" placeholder="ProductName">
        <label for="product-name">Product Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="number" class="form-control" id="product-price" placeholder="ProductPrice">
        <label for="product-price">Product Price</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="product-category" placeholder="ProductCategory">
        <label for="product-category">Product Category</label>
      </div>

      <div class="form-floating mb-3">
        <textarea class="form-control" placeholder="ProductDescription" id="product-description" style="height: 100px"></textarea>
        <label for="product-description">Product Description</label>
      </div>
    </div>
     

    <div class="form-floating mb-3">
      <input type="file" class="form-control" accept="Images/*" id="product-images" placeholder="ProductCategory">
      <label for="product-images">Product Images</label>
    </div>  


    <div class="d-flex justify-content-end gap-2">
      <button id="addBtn" class="btn btn-primary mt-2 ms-auto d-block" onclick="addProduct()">Add</button>
      <button id="updateBtn" class="btn btn-success d-none" onclick="updateProduct()">Update</button>
    </div>
  </div>
   


   
  <div class="container mt-4">

    <div class="form-floating my-3">
      <input type="search" class="form-control" id="productSearchInput" placeholder="Search product..." />
      <label for="productSearchInput">search product name ...</label>
    </div>
    


    <table class="table text-center table-bordered align-middle">
      <thead class="table-primary">
        <tr>
          <th scope="col">No.</th>
          <th scope="col">Name</th>
          <th scope="col">Price</th>
          <th scope="col">Category</th>
          <th scope="col">Description</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="myBody"></tbody>
    </table>
  </div>



  <!-- ✅ Bootstrap JS -->
   <script src="./JS/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
